name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo reports are up to date
        run: |
          make demo
          git status --porcelain examples
          test -z "$(git status --porcelain examples)"
      - name: Site builds
        run: python scripts/build_site.py --out site --as-of 2026-10-22
      - name: Package installs and runs
        run: |
          pip install .
          effective-passkey --version
