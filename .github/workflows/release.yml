name: Release
# Pushing a tag like v0.3.0 builds the package and publishes a free GitHub Release
# with the wheel, sdist and a zip of the agent skill.
# PyPI (also free) is opt-in: add a trusted publisher for this repository and
# workflow on pypi.org, then set the repository variable PYPI_ENABLED to "true".
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          v=$(python -c "import effective_passkey; print(effective_passkey.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: python -m unittest discover -s tests
      - run: python -m pip install build && python -m build
      - name: Skill bundle
        run: cd skills && zip -r ../dist/effective-passkey-skill.zip effective-passkey
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v"$" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "EffectivePasskey $GITHUB_REF_NAME" --notes-file notes.md
  pypi:
    needs: build
    if: ${{ vars.PYPI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm dist/effective-passkey-skill.zip
      - uses: pypa/gh-action-pypi-publish@release/v1
